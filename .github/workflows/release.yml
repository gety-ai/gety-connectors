# Releases with changesets and npm trusted publishing (OIDC); no npm token.
# npm trusted publishers are bound to this file name: keep it release.yml.
#
# On every push to main, select-mode decides what to do:
# - version: pending changesets exist, so the version job runs
#   `pnpm version-packages` (versions, CHANGELOG.md, manifest.json and
#   package.json `gety`, see scripts/version.ts) and force-pushes the result
#   to the changeset-release/main branch. The organization does not let
#   GITHUB_TOKEN create pull requests, so the job does not open one: an open
#   pull request from that branch updates with the push; otherwise the job
#   summary links to opening it.
# - publish: some package version is not on npm yet (the version PR was
#   merged), so the pack job builds and packs them and the publish job
#   publishes the tarballs, pushes `<package>@<version>` tags, then generates
#   @gety-connectors/catalog from the registry and publishes it when it
#   changed. The catalog is `private` in the workspace, so changesets neither
#   versions nor packs it.
#
# Only the publish job can mint an OIDC token, following
# https://changesets.dev/guide/automating#trusted-publishing. A publish job
# that failed can be re-run: changesets skips the packages already on npm.

name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version branch
      pull-requests: read # find the open version pull request
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          # `changeset version` looks up the commit that added each changeset
          # for the changelog; in a shallow clone it runs `git fetch --deepen`,
          # which has no credentials here (persist-credentials: false).
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version packages
        run: pnpm version-packages

      - name: Push the version branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: changeset-release/main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "${BRANCH}"
          git add --all
          git commit --quiet --message 'chore: version packages'
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 --wrap=0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push --force origin "HEAD:refs/heads/${BRANCH}"
          pr="$(gh pr list --head "${BRANCH}" --base main --state open --json url --jq '.[0].url // empty')"
          if [ -n "${pr}" ]; then
            echo "Updated the version pull request: ${pr}" >> "${GITHUB_STEP_SUMMARY}"
          else
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1&title=chore%3A%20version%20packages"
            echo "::notice::No open version pull request; open it at ${url}"
            echo "No open version pull request. [Open it](${url})." >> "${GITHUB_STEP_SUMMARY}"
          fi

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check versions and manifests are in sync
        run: deno task sync:check

      - name: Build connectors
        run: deno task --recursive build

      - name: Verify package tarballs
        run: deno task verify:packs

      - name: Pack packages
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write # push release tags
      id-token: write # npm trusted publishing
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `changeset publish` runs `pnpm publish`, which pnpm 10 delegates to the
      # npm CLI next to the Node.js binary; npm does the OIDC exchange (also
      # for the catalog's `npm publish`) and needs version 11.5.1 or later for
      # trusted publishing.
      - name: Check npm supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          if [ "$(printf '%s\n' 11.5.1 "${npm_version}" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::npm ${npm_version} cannot publish with trusted publishing; 11.5.1 or later is required"
            exit 1
          fi

      # No GitHub Releases: Gety's "Install from GitHub" would treat them as
      # connector releases without the required assets. Tags are still pushed.
      - name: Publish packages
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: false

      # Lists every connector at its npm `latest` and publish time, so it runs
      # after the connectors are published. It fails when a connector at this
      # commit is not on npm at its package.json version (after waiting out
      # the registry's cache), and writes the package directory only when the
      # catalog differs from the published one.
      - name: Generate the catalog
        run: deno task catalog --out "${RUNNER_TEMP}/catalog"

      # `npm publish`, not pnpm: the directory is outside the workspace and
      # already contains the LICENSE.
      - name: Publish the catalog
        run: |
          if [ -d "${RUNNER_TEMP}/catalog" ]; then
            npm publish "${RUNNER_TEMP}/catalog"
          else
            echo 'The published catalog is up to date.'
          fi
