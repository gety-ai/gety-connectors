name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Gety's bundled Deno sidecar version.
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check versions and manifests are in sync
        run: deno task sync:check

      - name: Check the vendored Gety SDK is unmodified
        run: deno task sync-sdk:check

      - name: Check formatting
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type-check tools
        run: deno task check:tools

      - name: Test tools
        run: deno task test:tools

      - name: Type-check connectors
        run: deno task --recursive check

      - name: Test connectors
        run: deno task --recursive test

      - name: Build connectors
        run: deno task --recursive build

      - name: Check generated files are committed
        run: |
          git diff --exit-code
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Pack and verify package tarballs
        run: deno task verify:packs
